<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="我是 anan，可持续互联网平台产品运营 / 品牌策划。">
  <meta name="theme-color" content="#f4f5ef">
  <title>anan · 产品运营 / 品牌策划</title>
  <link rel="canonical" href="https://cv.chenganan.com/">
  <style>
    /* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V4
       genre: editorial · macrostructure: Letter · theme: Garden
       nav: N9 edge-aligned · footer: Ft6 letter-close · motion: none
       Audience: recruiters and collaborators · Use: personal introduction */
    :root {
      --color-paper: oklch(96.7% .009 115);
      --color-ink: oklch(25% .018 145);
      --color-muted: oklch(45% .018 145);
      --color-accent: oklch(43% .10 145);
      --color-rule: oklch(81% .02 115);
      --font-display: "Palatino Linotype", "Songti SC", "SimSun", serif;
      --font-body: "PingFang SC", "Microsoft YaHei", sans-serif;
      --space-sm: .75rem; --space-md: 1rem; --space-lg: 1.5rem;
      --space-xl: 2.5rem; --space-2xl: 4rem; --space-3xl: 6rem;
    }
    * { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 1rem/1.65 var(--font-body); }
    .page { width: min(100% - 48px, 1040px); margin-inline: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding-block: var(--space-xl); gap: var(--space-md); }
    .wordmark { font: 700 1.5rem var(--font-display); letter-spacing: -.04em; }
    .edition { color: var(--color-muted); font-size: .875rem; }
    main { max-width: 760px; padding: var(--space-3xl) 0 var(--space-2xl); }
    .hello { margin: 0 0 var(--space-lg); color: var(--color-muted); }
    h1 { margin: 0 0 var(--space-xl); font: 400 clamp(3rem, 7vw, 5.25rem)/1.15 var(--font-display); letter-spacing: -.04em; overflow-wrap: anywhere; min-width: 0; font-style: normal; }
    h1 span { color: var(--color-accent); }
    .intro { margin: 0; max-width: 26em; font-size: clamp(1.25rem, 3vw, 1.65rem); line-height: 1.65; }
    .roles { margin-top: var(--space-2xl); display: flex; flex-wrap: wrap; column-gap: var(--space-xl); row-gap: var(--space-sm); color: var(--color-muted); }
    .roles span { display: inline-flex; align-items: center; gap: var(--space-sm); }
    .roles span::before { content: ""; width: 5px; height: 5px; background: var(--color-accent); border-radius: 50%; }
    footer { padding-block: var(--space-xl); border-top: 1px solid var(--color-rule); }
    .signoff { margin: 0 0 var(--space-lg); color: var(--color-muted); }
    .signature { display: block; margin-top: var(--space-sm); color: var(--color-ink); font: 400 2rem var(--font-display); }
    a { display: inline-flex; align-items: center; min-height: 44px; color: var(--color-accent); text-decoration-thickness: 1px; text-underline-offset: 5px; white-space: nowrap; }
    a:hover { text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 5px; }
    .bottom { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--space-md); font-size: .875rem; color: var(--color-muted); }
    @media (max-width: 640px) { .page { width: calc(100% - 40px); } header { padding-block: var(--space-lg); } main { padding-top: var(--space-2xl); } .roles { margin-top: var(--space-xl); } }
    @media print { .page { width: 100%; } main { padding-top: var(--space-xl); } }
  </style>
</head>
<body>
  <div class="page">
    <header><span class="wordmark">anan.</span><span class="edition">个人简介 / CV</span></header>
    <main>
      <p class="hello">你好，很高兴认识你。</p>
      <h1>我是 <span>anan</span>。</h1>
      <p class="intro">可持续互联网平台<br>产品运营 / 品牌策划</p>
      <div class="roles" aria-label="职业领域"><span>可持续互联网</span><span>产品运营</span><span>品牌策划</span></div>
    </main>
    <footer>
      <p class="signoff">谢谢你来认识我。<span class="signature">anan</span></p>
      <div class="bottom"><a href="https://chenganan.com/">访问我的主页 ↗</a><span>cv.chenganan.com</span></div>
    </footer>
  </div>
</body>
</html>
